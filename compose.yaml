services:
  app:
    build: ./app
    container_name: compose-node-app
    ports:
      - "3000:3000"
    environment:
      MONGO_URL: mongodb://mongodb:27017
    depends_on:
      mongodb:
        condition: service_started
    restart: unless-stopped

  mongodb:
    image: mongo:8
    container_name: compose-mongodb
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
